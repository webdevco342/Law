<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard | Qurat-ul-Ain Viirk</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --admin-bg: #f4f6f8;
        --admin-surface: #ffffff;
        --admin-border: #e2e8f0;
        --admin-primary: var(--navy);
        --admin-accent: var(--gold);
        --admin-text: #1e293b;
        --admin-text-light: #64748b;
      }
      body {
        background-color: var(--admin-bg);
        color: var(--admin-text);
        font-family: var(--font-body);
        margin: 0;
        display: flex;
        min-height: 100vh;
      }
      .admin-sidebar {
        width: 250px;
        background-color: var(--admin-primary);
        color: var(--ivory);
        display: flex;
        flex-direction: column;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        box-sizing: border-box;
      }
      .admin-sidebar h1 {
        font-family: var(--font-display);
        font-size: 24px;
        margin: 0 0 40px 0;
        color: var(--gold);
        line-height: 1.2;
      }
      .admin-nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .admin-nav a {
        color: var(--ivory);
        text-decoration: none;
        padding: 12px 16px;
        border-radius: 6px;
        transition: background 0.2s;
        font-weight: 500;
        display: block;
      }
      .admin-nav a:hover, .admin-nav a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: var(--gold);
      }
      .admin-nav a.logout {
        margin-top: auto;
        color: #fca5a5;
      }
      .admin-main {
        margin-left: 250px;
        flex: 1;
        padding: 40px;
        box-sizing: border-box;
      }
      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--admin-border);
        padding-bottom: 20px;
      }
      .admin-header h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 32px;
        color: var(--admin-primary);
      }
      .btn-save {
        background-color: var(--admin-accent);
        color: var(--admin-primary);
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      .btn-save:hover {
        background-color: var(--gold-dark);
        color: var(--ivory);
      }
      .btn-save:active {
        transform: scale(0.98);
      }
      .admin-card {
        background-color: var(--admin-surface);
        border: 1px solid var(--admin-border);
        border-radius: 8px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .admin-card h3 {
        margin-top: 0;
        font-family: var(--font-display);
        color: var(--admin-primary);
        font-size: 22px;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--admin-text);
      }
      .form-group input, .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--admin-border);
        border-radius: 6px;
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--admin-text);
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }
      .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: var(--admin-accent);
        box-shadow: 0 0 0 3px rgba(198, 162, 67, 0.2);
      }
      .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #10b981;
        color: white;
        padding: 16px 24px;
        border-radius: 8px;
        font-weight: 600;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        transform: translateY(100px);
        opacity: 0;
        transition: transform 0.3s, opacity 0.3s;
        z-index: 9999;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Auth Guard Script (Runs immediately to prevent flash of content) -->
    <script>
      if (sessionStorage.getItem('admin_auth') !== 'true') {
        window.location.href = 'index.html';
      }
    </script>

    <aside class="admin-sidebar">
      <h1>Qurat-ul-Ain<br>Admin</h1>
      <nav class="admin-nav">
        <a href="#" class="active">Homepage Content</a>
        <a href="index.html" class="logout" id="logout-btn">Log out &rarr;</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h2>Content Editor</h2>
        <button class="btn-save" id="save-btn">Save Changes</button>
      </header>

      <div class="admin-card">
        <h3>Hero Section</h3>
        <div class="form-group">
          <label for="hero-title">Main Title</label>
          <input type="text" id="hero-title" value="A practice built on precision." />
        </div>
        <div class="form-group">
          <label for="hero-subtitle">Subtitle / Intro text</label>
          <textarea id="hero-subtitle">Legal strategy and advocacy grounded in rigorous analysis, institutional experience, and a commitment to principle.</textarea>
        </div>
      </div>

      <div class="admin-card">
        <h3>Contact Details (Footer)</h3>
        <div class="form-group">
          <label for="contact-email">Email Address</label>
          <input type="email" id="contact-email" value="wicky.mechanier1446@gmail.com" />
        </div>
      </div>
    </main>

    <div class="toast" id="toast">✅ Changes saved successfully!</div>

    <script>
      // Populate fields from localStorage if they exist
      document.addEventListener("DOMContentLoaded", () => {
        const siteData = JSON.parse(localStorage.getItem('qav_site_data') || '{}');
        
        if (siteData.heroTitle) document.getElementById('hero-title').value = siteData.heroTitle;
        if (siteData.heroSubtitle) document.getElementById('hero-subtitle').value = siteData.heroSubtitle;
        if (siteData.contactEmail) document.getElementById('contact-email').value = siteData.contactEmail;
      });

      // Save changes
      document.getElementById('save-btn').addEventListener('click', () => {
        const siteData = {
          heroTitle: document.getElementById('hero-title').value,
          heroSubtitle: document.getElementById('hero-subtitle').value,
          contactEmail: document.getElementById('contact-email').value,
        };
        
        localStorage.setItem('qav_site_data', JSON.stringify(siteData));
        
        // Show toast
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      });

      // Logout
      document.getElementById('logout-btn').addEventListener('click', (e) => {
        sessionStorage.removeItem('admin_auth');
      });
    </script>
  </body>
</html>
